[[mods]]
    modId="entitykeeper"
    version="1.0.0"
    displayName="EntityKeeper"
    description='''
        Keeps entities loaded and alive across chunk boundaries.
        Supports forced despawn timers even for modded entities that never expire.
        Use /entitykeeper to manage rules by entity type.
    '''
    authors="EntityKeeper"

